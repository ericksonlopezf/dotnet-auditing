# ─── Codecov Configuration ───────────────────────────────────────────────────
# Full documentation: https://docs.codecov.com/docs/codecov-yaml
# Validate this file: curl -X POST --data-binary @.codecov.yml https://codecov.io/validate
# ─────────────────────────────────────────────────────────────────────────────

codecov:
  require_ci_to_pass: true
  max_report_age: on

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # ─── Project coverage: overall target ─────────────────────────────────────
    project:
      default:
        # Require 99% line coverage project-wide (threshold: 1% tolerance)
        target: 99%
        threshold: 1%
        if_ci_failed: error
        only_pulls: false

    # ─── Patch coverage: new code in PRs ──────────────────────────────────────
    patch:
      default:
        target: 90%
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false

# ─── Path exclusions ─────────────────────────────────────────────────────────
ignore:
  - "tests/**/*"
  - "benchmarks/**/*"
  - "samples/**/*"
  - "**/*.g.cs"
  - "**/GeneratedFiles/**"
