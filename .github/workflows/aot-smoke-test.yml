name: NativeAOT Smoke Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to use"
        required: false
        type: string
        default: "10.0.x"

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  aot-smoke-test:
    name: NativeAOT Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: AOT Publish Smoke Test
        run: dotnet publish tests/EricksonLopez.Auditing.AotSmokeTest/EricksonLopez.Auditing.AotSmokeTest.csproj -c Release -r linux-x64 --self-contained
