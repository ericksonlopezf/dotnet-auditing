name: Benchmarks (Baseline Capture)

# ─── Purpose ─────────────────────────────────────────────────────────────────
# Runs BenchmarkDotNet benchmarks and commits the resulting markdown reports
# to benchmarks/results/ to establish a regression baseline.
#
# Results are committed back to the triggering branch so that the repo always
# has an up-to-date performance baseline for comparison.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      benchmark-filter:
        description: "BenchmarkDotNet filter glob (e.g. '*Pipeline*', '*' for all)"
        required: false
        default: "*"
        type: string
      commit-results:
        description: "Commit benchmark results back to the branch"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (multi-version for cross-TFM benchmarks)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Auditing.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Auditing.slnx --no-restore --configuration Release

      # ─── Run BenchmarkDotNet for each supported target framework ─────────
      - name: Run benchmarks (.NET 8.0)
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Auditing.Benchmarks/EricksonLopez.Auditing.Benchmarks.csproj
          --configuration Release
          --framework net8.0
          --
          --filter "${{ inputs.benchmark-filter || '*' }}"
          --job short
          --exporters json markdown
          --artifacts ./benchmarks/results/net8.0

      - name: Run benchmarks (.NET 9.0)
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Auditing.Benchmarks/EricksonLopez.Auditing.Benchmarks.csproj
          --configuration Release
          --framework net9.0
          --
          --filter "${{ inputs.benchmark-filter || '*' }}"
          --job short
          --exporters json markdown
          --artifacts ./benchmarks/results/net9.0

      - name: Run benchmarks (.NET 10.0)
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Auditing.Benchmarks/EricksonLopez.Auditing.Benchmarks.csproj
          --configuration Release
          --framework net10.0
          --
          --filter "${{ inputs.benchmark-filter || '*' }}"
          --job short
          --exporters json markdown
          --artifacts ./benchmarks/results/net10.0

      - name: Upload benchmark results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmarks/results/
          retention-days: 90

      # ─── Commit results back to the branch ───────────────────────────────
      - name: Commit benchmark results
        if: ${{ inputs.commit-results != 'false' && success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p benchmarks/results
          git add -A benchmarks/results/
          if git diff --staged --quiet; then
            echo "No benchmark result changes to commit."
          else
            git commit -m "chore(benchmarks): update performance baseline [skip ci]

          Run: ${{ github.run_id }}
          Trigger: ${{ github.event_name }}
          Runtimes: .NET 8.0, .NET 9.0, .NET 10.0
          Filter: ${{ inputs.benchmark-filter || '*' }}
          "
            git push
          fi

      - name: Post benchmark summary to Step Summary
        if: always()
        run: |
          FOUND=0
          for SUMMARY in $(find benchmarks/results -name "*.md" 2>/dev/null | sort); do
            echo "## $(basename $SUMMARY)" >> "$GITHUB_STEP_SUMMARY"
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            FOUND=1
          done
          if [ $FOUND -eq 0 ]; then
            echo "### ⚠️ No benchmark markdown results found" >> "$GITHUB_STEP_SUMMARY"
          fi
