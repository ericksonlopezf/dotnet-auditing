name: Publish NuGet

# ─── Triggers ─────────────────────────────────────────────────────────────────
# 1. Automatic: Triggered by Release Please when a release PR is merged.
#    The workflow_dispatch input 'version' will be set to the new SemVer.
# 2. Manual: Also triggered by pushing a 'v*.*.*' tag manually (legacy support).
# 3. Manual dispatch: Via GitHub UI for debugging.
#
# Automatic versioning flow:
#   Commit with Conventional prefix (e.g. 'feat:') →
#   release-please.yml creates/updates Release PR →
#   Maintainer merges Release PR →
#   release-please creates GitHub Release + tag vX.Y.Z →
#   release-please triggers this workflow via workflow_dispatch →
#   Pack → Sign → Attest → Publish to NuGet.org
# ─────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*.*.*"           # Legacy: manual tag push still works
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3 — without 'v' prefix)"
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  mutation-tests:
    name: Mutation Testing Gate
    uses: ./.github/workflows/mutation-testing.yml
    secrets: inherit

  benchmark-gate:
    name: Performance Benchmark Gate
    uses: ./.github/workflows/benchmarks.yml
    with:
      commit-results: "false"
    secrets: inherit

  publish:
    name: Pack & Publish
    needs: [mutation-tests, benchmark-gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Required for Sigstore OIDC attestation
      contents: write        # Required for GitHub Release creation
      attestations: write    # Required for actions/attest-build-provenance
      statuses: read         # Required to query commit statuses for Stryker quality gate
      actions: read          # Required to query workflow runs for Stryker quality gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Resolve version ──────────────────────────────────────────────────────
      # Priority: workflow_dispatch input → git tag → fallback to Directory.Build.props
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from workflow_dispatch input: $INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from git tag: $VERSION"
          else
            VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "1.0.0")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from Directory.Build.props: $VERSION"
          fi

      # ─── Validate Stryker Mutation Testing Quality Gate ───────────────────────
      - name: Validate Stryker Mutation Quality Gate
        id: mutation-gate
        uses: actions/github-script@v7
        with:
          script: |
            const verifyMutationGate = require('./scripts/verify-mutation-gate.js');
            await verifyMutationGate({ github, context, core });

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ─── Strong Name key ──────────────────────────────────────────────────────
      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore
        run: dotnet restore EricksonLopez.Mediator.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Mediator.slnx --no-restore --configuration Release

      # ─── Full test suite before publish ──────────────────────────────────────
      - name: Run tests before publish
        run: |
          dotnet test EricksonLopez.Mediator.slnx \
            --no-build \
            --configuration Release \
            --logger "trx" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings

      - name: Upload coverage to Codecov (publish gate)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.opencover.xml,**/coverage.cobertura.xml"
          fail_ci_if_error: false
          flags: publish-gate
          name: codecov-publish

      # ─── Pack all packages ────────────────────────────────────────────────────
      - name: Pack All Packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_ARGS="--no-build --configuration Release --output ./nupkgs -p:VersionPrefix=$VERSION -p:TreatWarningsAsErrors=true"
          dotnet pack src/EricksonLopez.Mediator/EricksonLopez.Mediator.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.Generator/EricksonLopez.Mediator.Generator.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.OpenTelemetry/EricksonLopez.Mediator.OpenTelemetry.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.Polly/EricksonLopez.Mediator.Polly.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.Result/EricksonLopez.Mediator.Result.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.Testing/EricksonLopez.Mediator.Testing.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.FluentValidation/EricksonLopez.Mediator.FluentValidation.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.AspNetCore/EricksonLopez.Mediator.AspNetCore.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Mediator.RateLimiting/EricksonLopez.Mediator.RateLimiting.csproj $PACK_ARGS
          echo "Packed packages:"
          ls -la ./nupkgs/

      # ─── Sigstore Provenance Attestation ─────────────────────────────────────
      - name: Generate Sigstore Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: './nupkgs/*.nupkg'

      # ─── NuGet.org publish via OIDC ──────────────────────────────────────────
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ericksonlopezf

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ─── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body: |
            ## Ecosystem Packages in this release

            | Package | Version |
            |---------|---------|
            | `EricksonLopez.Mediator` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.Generator` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.OpenTelemetry` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.Polly` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.Result` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.Testing` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.FluentValidation` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.AspNetCore` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Mediator.RateLimiting` | `${{ steps.version.outputs.VERSION }}` |

            ---

            For detailed changes, see [CHANGELOG.md](https://github.com/ericksonlopezf/dotnet-mediator/blob/${{ github.ref_name }}/CHANGELOG.md).

            ### Installation

            ```bash
            dotnet add package EricksonLopez.Mediator --version ${{ steps.version.outputs.VERSION }}
            dotnet add package EricksonLopez.Mediator.Result --version ${{ steps.version.outputs.VERSION }}
            dotnet add package EricksonLopez.Mediator.AspNetCore --version ${{ steps.version.outputs.VERSION }}
            ```
          files: ./nupkgs/*.nupkg
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
