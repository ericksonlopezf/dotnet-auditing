name: Publish NuGet

# ─── Triggers ─────────────────────────────────────────────────────────────────
# 1. Automatic: Triggered by Release Please when a release PR is merged.
#    The workflow_dispatch input 'version' will be set to the new SemVer.
# 2. Manual: Also triggered by pushing a 'v*.*.*' tag manually (legacy support).
# 3. Manual dispatch: Via GitHub UI for debugging.
#
# Automatic versioning flow:
#   Commit with Conventional prefix (e.g. 'feat:') →
#   release-please.yml creates/updates Release PR →
#   Maintainer merges Release PR →
#   release-please creates GitHub Release + tag vX.Y.Z →
#   release-please triggers this workflow via workflow_dispatch →
#   Pack → Sign → Attest → Publish to NuGet.org
# ─────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*.*.*"           # Legacy: manual tag push still works
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3 — without 'v' prefix)"
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmark-gate:
    name: Benchmark Validation & Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (multi-version for cross-TFM benchmarks)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Auditing.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Auditing.slnx --no-restore --configuration Release

      # ─── Run BenchmarkDotNet for each supported target framework ─────────
      - name: Run benchmarks (.NET 8.0)
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Auditing.Benchmarks/EricksonLopez.Auditing.Benchmarks.csproj
          --configuration Release
          --framework net8.0
          --
          --filter "*"
          --job short
          --exporters json markdown
          --artifacts ./benchmarks/results/net8.0

      - name: Run benchmarks (.NET 9.0)
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Auditing.Benchmarks/EricksonLopez.Auditing.Benchmarks.csproj
          --configuration Release
          --framework net9.0
          --
          --filter "*"
          --job short
          --exporters json markdown
          --artifacts ./benchmarks/results/net9.0

      - name: Run benchmarks (.NET 10.0)
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Auditing.Benchmarks/EricksonLopez.Auditing.Benchmarks.csproj
          --configuration Release
          --framework net10.0
          --
          --filter "*"
          --job short
          --exporters json markdown
          --artifacts ./benchmarks/results/net10.0

      - name: Upload benchmark results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-results-${{ github.run_id }}
          path: benchmarks/results/
          retention-days: 90

  publish:
    name: Pack & Publish
    needs: [benchmark-gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Required for Sigstore OIDC attestation
      contents: write        # Required for GitHub Release creation
      attestations: write    # Required for actions/attest-build-provenance
      statuses: read         # Required to query commit statuses for Stryker quality gate
      actions: read          # Required to query workflow runs for Stryker quality gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Resolve version ──────────────────────────────────────────────────────
      # Priority: workflow_dispatch input → git tag → fallback to Directory.Build.props
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from workflow_dispatch input: $INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from git tag: $VERSION"
          else
            VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "1.0.0")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from Directory.Build.props: $VERSION"
          fi

      # ─── Validate Stryker Mutation Testing Quality Gate ───────────────────────
      - name: Validate Stryker Mutation Quality Gate
        id: mutation-gate
        uses: actions/github-script@v7
        with:
          script: |
            const verifyMutationGate = require('./scripts/verify-mutation-gate.js');
            await verifyMutationGate({ github, context, core });

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore EricksonLopez.Auditing.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Auditing.slnx --no-restore --configuration Release

      # ─── Full test suite before publish ──────────────────────────────────────
      - name: Run tests before publish
        run: |
          dotnet test EricksonLopez.Auditing.slnx \
            --no-build \
            --configuration Release \
            --filter "Category!=Integration" \
            --logger "trx" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload coverage to Codecov (publish gate)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.opencover.xml"
          fail_ci_if_error: false
          flags: publish-gate
          name: codecov-publish

      # ─── Pack all packages ────────────────────────────────────────────────────
      - name: Pack All Packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_ARGS="--no-build --configuration Release --output ./nupkgs -p:VersionPrefix=$VERSION -p:TreatWarningsAsErrors=true"
          dotnet pack src/EricksonLopez.Auditing.Abstractions/EricksonLopez.Auditing.Abstractions.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing/EricksonLopez.Auditing.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.Dapper/EricksonLopez.Auditing.Dapper.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.EntityFrameworkCore/EricksonLopez.Auditing.EntityFrameworkCore.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.MongoDb/EricksonLopez.Auditing.MongoDb.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.MySql/EricksonLopez.Auditing.MySql.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.OpenTelemetry/EricksonLopez.Auditing.OpenTelemetry.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.Oracle/EricksonLopez.Auditing.Oracle.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.PostgreSql/EricksonLopez.Auditing.PostgreSql.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.Sqlite/EricksonLopez.Auditing.Sqlite.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.SqlServer/EricksonLopez.Auditing.SqlServer.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.Auditing.Testing/EricksonLopez.Auditing.Testing.csproj $PACK_ARGS
          echo "Packed packages:"
          ls -la ./nupkgs/

      # ─── Sigstore Provenance Attestation ─────────────────────────────────────
      - name: Generate Sigstore Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: './nupkgs/*.nupkg'

      # ─── NuGet.org publish via OIDC ──────────────────────────────────────────
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ericksonlopezf

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ─── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body: |
            ## Ecosystem Packages in this release

            | Package | Version |
            |---------|---------|
            | `EricksonLopez.Auditing.Abstractions` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.Dapper` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.EntityFrameworkCore` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.MongoDb` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.MySql` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.OpenTelemetry` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.Oracle` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.PostgreSql` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.Sqlite` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.SqlServer` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.Auditing.Testing` | `${{ steps.version.outputs.VERSION }}` |

            ---

            For detailed changes, see [CHANGELOG.md](https://github.com/ericksonlopezf/dotnet-auditing/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: ./nupkgs/*.nupkg
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
