name: Reusable — .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to use"
        required: false
        type: string
        default: "10.0.x"
      test-filter:
        description: "Test filter expression (e.g., Category!=Integration)"
        required: false
        type: string
        default: ""
      test-project:
        description: "Specific test project path (leave empty to run all)"
        required: false
        type: string
        default: ""
      upload-coverage:
        description: "Whether to upload code coverage artifacts"
        required: false
        type: boolean
        default: true
      artifact-name:
        description: "Name for the test results artifact"
        required: false
        type: string
        default: "test-results"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token for coverage reporting"
        required: false
      SONAR_TOKEN:
        description: "SonarCloud token for analysis"
        required: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Verify Solution Compliance
        run: node scripts/verify-solution-compliance.js

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

      - name: Setup Java (for SonarScanner)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
     
      - name: Begin Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin /k:"ericksonlopezf_${{ github.event.repository.name }}" \
            /o:"ericksonlopezf" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="samples/**,benchmarks/**,scripts/**,.github/**,**/bin/**,**/obj/**,**/*.js,**/*.json,**/*.md,**/*.yml,**/*.yaml,**/*.sql" \
            /d:sonar.coverage.exclusions="tests/**,samples/**,benchmarks/**,**/*Tests.cs,**/*Test*.cs,**/tests/**,**/benchmarks/**,**/samples/**,**/bin/**,**/obj/**,**/*Generator*.cs,**/*Analyzer*.cs,**/EquatableArray.cs,**/GeneratorHelpers.cs,**/Shared/**,**/*.g.cs,**/Generated/**" \
            /d:sonar.cpd.exclusions="**/*"

      - name: Build (Release)
        run: dotnet build EricksonLopez.Auditing.slnx --configuration Release

      - name: Run tests
        run: >
          dotnet test
          ${{ inputs.test-project != '' && inputs.test-project || 'EricksonLopez.Auditing.slnx' }}
          --no-build
          --configuration Release
          ${{ inputs.test-filter != '' && format('--filter "{0}"', inputs.test-filter) || '' }}
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: End Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ./test-results/

      - name: Upload coverage to Codecov
        if: always() && inputs.upload-coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "./test-results/**/coverage.cobertura.xml"
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ inputs.artifact-name }}
