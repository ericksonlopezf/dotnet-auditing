name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    uses: ./.github/workflows/dotnet-build-test.yml
    with:
      artifact-name: test-results
      test-project: tests/EricksonLopez.Auditing.UnitTests/EricksonLopez.Auditing.UnitTests.csproj
    secrets:
      SNK_KEY: ${{ secrets.SNK_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
