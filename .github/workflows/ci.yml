name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: build-and-test
    uses: ./.github/workflows/dotnet-build-test.yml
    with:
      artifact-name: test-results
      test-filter: "Category!=Integration"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  aot-smoke-test:
    name: aot-smoke-test
    uses: ./.github/workflows/aot-smoke-test.yml
