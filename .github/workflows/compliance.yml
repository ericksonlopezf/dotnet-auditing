name: Repository Compliance & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  compliance-gate:
    name: Compliance & Architecture Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Verify Solution Compliance
        run: node scripts/verify-solution-compliance.js

      - name: Run Repository Compliance Verifier
        shell: pwsh
        run: ./scripts/verify-compliance.ps1
